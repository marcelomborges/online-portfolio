# Local dev stack — DEV-002
# Usage: docker compose up --build
# URLs: http://localhost:3000 (Nuxt) · http://localhost:8080 (API) · localhost:5432 (Postgres)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev
      POSTGRES_DB: portfolio_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend/OnlinePortfolio.Api
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__Default: Host=db;Port=5432;Database=portfolio_dev;Username=portfolio;Password=portfolio_dev
      ConnectionStrings__Migration: Host=db;Port=5432;Database=portfolio_dev;Username=portfolio;Password=portfolio_dev
    volumes:
      - ./backend/OnlinePortfolio.Api:/src
      - api_nuget:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NUXT_API_INTERNAL_BASE: http://api:8080
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_PLATFORM_HOST: onlineportfolio.com.br
      NUXT_PUBLIC_APP_HOST: app.onlineportfolio.com.br
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  api_nuget:
  frontend_node_modules:
