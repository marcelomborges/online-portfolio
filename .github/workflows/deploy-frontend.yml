name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel CLI must run from monorepo root when Root Directory = frontend in
      # project settings; running inside frontend/ doubles the path (frontend/frontend).
      - name: Pull Vercel project settings
        working-directory: .
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel environment variables
        working-directory: .
        run: vercel env pull frontend/.env.production.local --environment=production --yes --token="$VERCEL_TOKEN"

      - name: Build (Nuxt / Nitro)
        run: npm run build

      # npm run build runs in frontend/ (Nitro preset vercel → frontend/.vercel/output);
      # vercel deploy --prebuilt from monorepo root expects .vercel/output at repo root.
      - name: Stage prebuilt output for Vercel CLI
        working-directory: .
        run: |
          test -d frontend/.vercel/output
          cp -r frontend/.vercel/output .vercel/output

      - name: Deploy to Vercel (production)
        working-directory: .
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
