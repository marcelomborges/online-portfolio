name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/DATABASE.md'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do redeploy manual (opcional)'
        required: false
        type: string

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Backend Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore OnlinePortfolio.Api.slnx

      - name: Test
        run: dotnet test OnlinePortfolio.Api.slnx --no-restore --configuration Release

      - name: Apply database migrations (production)
        working-directory: backend/OnlinePortfolio.Api
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Migration: ${{ secrets.SUPABASE_MIGRATION_CONNECTION_STRING }}
        run: dotnet ef database update --configuration Release
